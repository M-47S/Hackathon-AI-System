name: "Branch Owner Check"
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch-creator:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR author is the branch creator
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branchCreator = pr.head.user.login; // Создатель ветки
            const prAuthor = pr.user.login;          // Тот, кто открыл PR (пушит)

            if (branchCreator !== prAuthor) {
              core.setFailed(`Доступ запрещен: ветку создал ${branchCreator}, а PR открыл ${prAuthor}. Только создатель ветки может предлагать изменения.`);
            }